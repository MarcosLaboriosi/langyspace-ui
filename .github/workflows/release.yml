name: Release UI Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag and package version
        id: version
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          expected_tag="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate package and visual layout
        run: pnpm run validate:ui

      - name: Upload release visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-library-release-layout-${{ github.sha }}
          path: .local/layout-audit
          if-no-files-found: ignore
          retention-days: 14

      - name: Pack release and checksum
        id: pack
        shell: bash
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          asset="langyspace-ui-${{ steps.version.outputs.version }}.tgz"
          sha256sum "release/${asset}" > "release/${asset}.sha256"
          echo "asset=${asset}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release/${{ steps.pack.outputs.asset }}" \
            "release/${{ steps.pack.outputs.asset }}.sha256" \
            --generate-notes \
            --title "@langyspace/ui ${{ steps.version.outputs.version }}" \
            --verify-tag
